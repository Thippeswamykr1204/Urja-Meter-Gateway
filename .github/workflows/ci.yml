name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements.lock
      - run: uv pip compile requirements.txt --python-version 3.11 --universal --output-file /tmp/requirements.lock --custom-compile-command 'uv pip compile requirements.txt --python-version 3.11 --universal --output-file requirements.lock' && diff -u requirements.lock /tmp/requirements.lock
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy .
      - run: .venv/bin/python -m coverage run -m pytest
      - run: .venv/bin/python -m coverage report --fail-under=85
      - run: .venv/bin/python -m coverage json -o .coverage.json
      - run: .venv/bin/python tools/check_coverage.py .coverage.json
      - run: .venv/bin/python tools/export_openapi/main.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:generated-types
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: nohup env DEMO_MODE=true DATABASE_URL=sqlite:///./ci.db .venv/bin/python -m uvicorn app.main:app --app-dir apps/api >/tmp/flock-api.log 2>&1 &
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run smoke
        working-directory: apps/web
