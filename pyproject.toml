[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flock-energy-api"
version = "0.1.0"
description = "A documented API facade for the Urja Meter Ops portal."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "coverage[toml]>=7.6,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "hypothesis>=6.122,<7",
  "jsonschema>=4.23,<5",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[tool.coverage.run]
branch = true
source = ["apps/api/app"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
exclude_also = ["class PortalAdapter\\(Protocol\\):", "\\.\\.\\."]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/app", "apps/api/tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["apps/api/tests", "tools"]
